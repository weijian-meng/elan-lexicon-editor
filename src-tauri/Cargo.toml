[package]
name = "app"
version = "0.3.0-beta.1"
description = "Desktop editor for ELAN-compatible XML lexicon files"
authors = ["Weijian Meng"]
license = "MIT"
repository = "https://github.com/weijian-meng/elan-lexicon-editor"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
quick-xml = { version = "0.31", features = ["serialize"] }
thiserror = "1.0"
anyhow = "1.0"
rfd = "0.15"
pathdiff = "0.2"
