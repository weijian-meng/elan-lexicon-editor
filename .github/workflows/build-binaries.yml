name: Build desktop binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            python_version: '3.11'
            archive_name: elan-lexicon-editor-macos.zip
            dist_target: "dist/ELAN Lexicon Editor.app"
            extra_packages: "pyobjc-core pyobjc-framework-WebKit"
            gui_backend: cocoa
          - os: windows-latest
            python_version: '3.11'
            archive_name: elan-lexicon-editor-windows.zip
            dist_target: "dist/ELAN Lexicon Editor"
            extra_packages: ""
            gui_backend: ""
          - os: ubuntu-latest
            python_version: '3.11'
            archive_name: elan-lexicon-editor-linux.zip
            dist_target: "dist/ELAN Lexicon Editor"
            extra_packages: "pywebview[qt] PyQt5"
            gui_backend: qt
    runs-on: ${{ matrix.os }}
    env:
      PYWEBVIEW_GUI: ${{ matrix.gui_backend }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          extra_packages="${{ matrix.extra_packages }}"
          if [ -n "${extra_packages}" ]; then
            python -m pip install ${extra_packages}
          fi

      - name: Build binary
        shell: bash
        run: |
          pyinstaller elan_lexicon_editor.spec --noconfirm --clean

      - name: Create archive
        shell: bash
        run: |
          mkdir -p artifacts
          python scripts/create_release_archive.py \
            --source "${{ matrix.dist_target }}" \
            --destination "artifacts/${{ matrix.archive_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: artifacts/${{ matrix.archive_name }}
