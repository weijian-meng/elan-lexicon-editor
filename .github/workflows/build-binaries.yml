name: Build desktop bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            platform: macos-14
            target: aarch64-apple-darwin
            bundle-path: src-tauri/target/aarch64-apple-darwin/release/bundle/**
          - name: macos-intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            bundle-path: src-tauri/target/x86_64-apple-darwin/release/bundle/**
          - name: windows
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle-path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --target ${{ matrix.target }}

      - name: Upload bundles
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tauri-bundles-${{ matrix.name }}
          path: ${{ matrix.bundle-path }}
